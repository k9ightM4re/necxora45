<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Nexora</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body data-page="forgot">
    <header class="auth-topbar">
      <a href="/login.html" class="back-link">← Back to Sign In</a>
      <a href="/index.html?landing=1" class="brand-lockup">
        <img src="/assets/logo.svg" alt="" width="28" height="28" />
        <span>NEXORA</span>
      </a>
    </header>

    <div class="auth-session-gate" id="auth-session-gate" aria-live="polite">
      <div style="display:grid;gap:12px;justify-items:center;">
        <div class="nx-loading-mark"><span class="nx-loading-ring"></span><img src="/assets/logo.svg" alt="NEXORA" /></div>
        <strong style="font-size:0.96rem;">Checking active NEXORA session...</strong>
      </div>
    </div>

    <main class="auth-main" id="auth-page-content" hidden>
      <section class="auth-card" aria-labelledby="forgot-heading">
        <div class="auth-header">
          <h1 id="forgot-heading">Reset your password</h1>
          <p>Enter your account email to receive a Firebase password reset link.</p>
        </div>

        <div class="form-alert" id="form-alert" role="alert" aria-live="polite"></div>

        <form class="auth-form" id="forgot-form" novalidate>
          <div class="field">
            <label class="field-label" for="forgot-email">Email address</label>
            <input
              id="forgot-email"
              type="email"
              class="text-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span class="field-error" id="err-email"></span>
          </div>

          <button type="submit" class="btn-submit" id="forgot-submit-btn">Send Reset Link</button>
        </form>

        <p class="auth-footer-link">
          Remembered it? <a href="/login.html">Sign in</a>
        </p>
      </section>
    </main>

    <script type="module" src="/js/auth.js"></script>
      <script type="module" src="/js/pwa.js"></script>
  </body>
</html>
