<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101124" />
    <title>Offline — NEXORA</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101124; color: #f8fafc; font-family: var(--font-sans, system-ui, sans-serif); text-align: center; }
      .card { width: min(440px, 100%); padding: 32px 26px; border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; background: #171630; }
      img { width: 64px; height: 64px; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 1.5rem; }
      p { margin: 0 0 22px; color: #cbd5e1; line-height: 1.6; }
      button { padding: 12px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #701cff, #286bff); color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/logo.svg" alt="NEXORA" />
      <h1>You are offline</h1>
      <p>Your NEXORA app could not reach the network. Reconnect and try again — cached pages will open in the meantime.</p>
      <button type="button" id="retry">Try again</button>
    </div>
    <script>document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });</script>
  </body>
</html>
